group: ontologies
name: bfo-cco-fleet
version: 1.0
label: "BFO/CCO worked example: fleet readiness"
description: "The bfo-cco kit plus a small fleet-maintenance knowledge graph aligned to CCO, and seven stored queries that show what BFO/CCO adds: CCO roll-ups over data that never mentions CCO, sensors inferred from capabilities, parts and locations at any depth, a bad record caught by BFO disjointness, and a domain-only control query whose answer does not change."

options:
  database.name: kit-bfo-cco-fleet
  search.enabled: true
  search.semantic.enabled: true
  graph.aliases: true
  voicebox.enabled: true
  query.timeout: 60s
  reasoning.schema.graphs: "tag:stardog:api:context:schema urn:stardog:bfo_cco:bfo urn:stardog:bfo_cco:cco urn:stardog:bfo_cco:supplements urn:fleet:ontology"
  search.semantic.index.contexts.filter: "tag:stardog:api:context:schema urn:stardog:bfo_cco:bfo urn:stardog:bfo_cco:cco urn:stardog:bfo_cco:supplements urn:fleet:ontology"

namespaces:
  "": "https://example.org/fleet#"
  d: "https://example.org/fleet/data/"
  schema: "https://schema.org/"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  owl: "http://www.w3.org/2002/07/owl#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  skos: "http://www.w3.org/2004/02/skos/core#"
  obo: "http://purl.obolibrary.org/obo/"
  cco: "https://www.commoncoreontologies.org/"
  bfo_cco: "urn:stardog:bfo_cco#"

alias: bfo_cco_fleet

data:
  # BFO/CCO, supplements and shapes: the same entries as ../bfo_cco/kit.yaml.
  # BFO 2020 core, from the BFO-2020 repository.
  - file: "https://raw.githubusercontent.com/BFO-ontology/BFO-2020/release-2024-01-29/src/owl/bfo-core.ttl"
    graph: "urn:stardog:bfo_cco:bfo"

  # CCO v2.2, from the CommonCoreOntologies repository: the 11 modules, which import BFO.
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/AgentOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/ArtifactOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/CurrencyUnitOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/EventOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/ExtendedRelationOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/FacilityOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/GeospatialOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/InformationEntityOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/QualityOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/TimeOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"
  - file: "https://raw.githubusercontent.com/CommonCoreOntology/CommonCoreOntologies/v2.2/src/cco-modules/UnitsOfMeasureOntology.ttl"
    graph: "urn:stardog:bfo_cco:cco"

  # Stardog inference supplements and SHACL shapes, original to this kit.
  - file: "../bfo_cco/schema/bfo_cco-stardog-inferences.ttl"
    graph: "urn:stardog:bfo_cco:supplements"
  - file: "../bfo_cco/constraints/bfo_cco-disjointness-shacl.ttl"
    graph: "urn:stardog:bfo_cco:constraints"

  # The fleet ontology and its CCO alignment: in the reasoning schema, and in urn:fleet:kg,
  # the graph the stored queries (and Voicebox) read.
  - file: "data/fleet_ontology.ttl"
    graph: "urn:fleet:ontology"
  - file: "data/fleet_cco_alignment.ttl"
    graph: "urn:fleet:ontology"
  - file: "data/fleet_ontology.ttl"
    graph: "urn:fleet:kg"
  - file: "data/fleet_cco_alignment.ttl"
    graph: "urn:fleet:kg"
  - file: "data/fleet_data.ttl"
    graph: "urn:fleet:kg"
  # A batch waiting for validation; AF-1011 is typed as both an aircraft and an event.
  - file: "data/incoming_batch.ttl"
    graph: "urn:fleet:incoming"

schemas:
  - name: "bfo_cco_fleet"
    graphs:
      - "urn:stardog:bfo_cco:bfo"
      - "urn:stardog:bfo_cco:cco"
      - "urn:stardog:bfo_cco:supplements"
      - "urn:fleet:ontology"

queries:
  - name: vehicles_by_type
    file: "queries/01_vehicles_by_type.rq"
    options:
      reasoning: true
  - name: sensors_inferred
    file: "queries/02_sensors_inferred.rq"
    options:
      reasoning: true
  - name: components_any_depth
    file: "queries/03_components_any_depth.rq"
    options:
      reasoning: true
  - name: located_any_depth
    file: "queries/04_located_any_depth.rq"
    options:
      reasoning: true
  - name: physical_inventory
    file: "queries/05_physical_inventory.rq"
    options:
      reasoning: true
  - name: bad_record_in_batch
    file: "queries/06_bad_record_in_batch.rq"
    options:
      reasoning: true
  - name: control_domain_query
    file: "queries/07_control_domain_query.rq"
    options:
      reasoning: true

metadata:
  license:
    name: "BFO: CC BY 4.0; CCO: BSD 3-Clause; kit files: Apache 2.0"
    link: "https://github.com/CommonCoreOntology/CommonCoreOntologies/blob/v2.2/LICENSE"
  marketplace:
    publisher: sd:Stardog
    status: Draft
    icon: "learning"
    tags:
      - BFO
      - CCO
      - Reasoning
      - Voicebox
    subject:
      - General
    type:
      - Demo
    primaryConcept: "https://www.commoncoreontologies.org/ont00001043"
    initialSearch: "`https://example.org/fleet/data/af-1001`"
    kitDb: "kit-bfo-cco-fleet"
